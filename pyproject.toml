[project]
name = "relevancy"
version = "0.1.0"
description = "Search evaluation with Jev as the judge. turbopuffer does the retrieval and hosted reranking, and DuckDB keeps every run and computes the metrics in SQL."
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rick Crawford" }
]
requires-python = ">=3.12"
keywords = [
    "search-evaluation", "information-retrieval", "relevance", "ndcg", "llm-as-a-judge", "reranking",
    "hybrid-search", "vector-search", "bm25", "esci", "turbopuffer", "duckdb", "jev", "python",
]
dependencies = [
    "duckdb>=2.0.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "tpuf-arrow",
    "turbopuffer==2.14.0",
    "typesafe-sdk>=0.7.5",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyflakes>=4.0.3",
    "ruff>=0.17.2",
]

[tool.uv.sources]
tpuf-arrow = { git = "https://github.com/rickcrawford/tpuf-arrow", rev = "a24f48d2739ae49b98e5ece33b6914062f2432fa" }
