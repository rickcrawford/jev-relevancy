title = "Semantic attributes at index time"
premise = "A concept stored once per product ('replacement part') fixes the queries that ask for it."
status = "ready"
rank = 4
keys = ["TURBOPUFFER_API_KEY", "TYPESAFE_API_KEY"]
base = true
decide = "attr-soft vs hybrid on the replacement-part queries, nDCG@10, lower bound above zero. Stop first if label precision is under 0.9."

[[steps]]
name = "find"
run = "uv run experiments/relevance-attributes/attributes.py find"
paid = false

[[steps]]
name = "label"
run = "uv run experiments/relevance-attributes/attributes.py label"
paid = true
note = "resumable; about 10k Jev requests"

[[steps]]
name = "check-export"
run = "uv run experiments/relevance-attributes/attributes.py check-export"
paid = false
note = "a person then fills in the rater column"

[[steps]]
name = "precision"
run = "uv run experiments/relevance-attributes/attributes.py precision"
paid = false
output = "results/precision.txt"
note = "stop if precision is under 0.9"

[[steps]]
name = "patch"
run = "uv run experiments/relevance-attributes/attributes.py patch"
paid = true
note = "writes two attributes to esci-us-full"

[[steps]]
name = "run"
run = "uv run experiments/relevance-attributes/attributes.py run"
paid = true

[[steps]]
name = "report"
run = "uv run experiments/relevance-attributes/attributes.py report"
paid = false
output = "results/report.txt"
